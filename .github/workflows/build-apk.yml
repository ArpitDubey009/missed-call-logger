name: Build MissedCallLogger APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger from GitHub website

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Step 4: Cache Gradle (speeds up future builds)
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      # Step 5: Make gradlew executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android

      # Step 6: Build the Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      # Step 7: Upload APK as downloadable artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MissedCallLogger-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Step 8: Show build success
      - name: Build Success
        run: echo "✅ APK built successfully! Download from the Artifacts section above."
